[project]
name = "atl06-processor"
version = "0.1.0"
description = "Stream ATL06 HDF5 granules into stac-hash sorted GeoParquet"
requires-python = ">=3.12"
dependencies = [
    "pyarrow>=21",
    "numpy>=2",
    "h5py>=3.11",
    "obstore>=0.12",
    "requests>=2.31",
    "earthaccess>=0.11",
    "stac-hash==0.0.2",
    "pyproj>=3.6",
    "pydantic-settings>=2.4",
    "boto3>=1.34",
    "pyiceberg[sql-sqlite,pyarrow]>=0.12,<0.13",  # iceberg.py writes DataFile internals
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atl06_processor"]
