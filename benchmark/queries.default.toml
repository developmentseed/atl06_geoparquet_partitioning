# Default query suite. Copy to benchmark/queries.toml (git-ignored) and set the dataset URIs.
# Predicates are plain: `time`, `longitude`, `latitude` (never stac_hash).
repeats = 3

# Plain glob: DuckDB opens every file's footer before pruning.
[[datasets]]
name = "stac_hash"
uri = "s3://REPLACE-BUCKET/runs/REPLACE-RUN/data/*.parquet"

# Same files through the Iceberg table: whole files are pruned from manifest bounds first.
# uri = report.json "iceberg_metadata".
[[datasets]]
name = "stac_hash_iceberg"
format = "iceberg"
uri = "s3://REPLACE-BUCKET/runs/REPLACE-RUN/iceberg/metadata/REPLACE.metadata.json"

# Optional month-partitioned baseline (atl06-bench baseline).
# [[datasets]]
# name = "baseline_month"
# uri = "s3://REPLACE-BUCKET/runs/REPLACE-RUN/baseline/**/*.parquet"

[[queries]]
name = "basin_full_year"  # Jakobshavn Isbræ, whole year
bbox = [-50.5, 68.8, -48.5, 69.4]
start = "2023-01-01"
end = "2024-01-01"
columns = ["time", "h_li", "geometry"]

[[queries]]
name = "ice_sheet_one_day_greenland"
bbox = [-74.0, 59.0, -10.0, 84.0]
start = "2023-07-01"
end = "2023-07-02"
columns = ["time", "h_li", "geometry"]

[[queries]]
name = "ice_sheet_one_week_antarctica"
bbox = [-180.0, -90.0, 180.0, -60.0]
start = "2023-03-01"
end = "2023-03-08"
columns = ["time", "h_li", "geometry"]

[[queries]]
name = "basin_one_week"
bbox = [-50.5, 68.8, -48.5, 69.4]
start = "2023-07-01"
end = "2023-07-08"
columns = ["time", "h_li", "geometry"]

[[queries]]
name = "global_one_day"  # time only: no spatial predicate
start = "2023-07-01"
end = "2023-07-02"
columns = ["time", "h_li", "geometry"]
