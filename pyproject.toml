[project]
name = "atl06-iceberg"
version = "0.1.0"
description = "ATL06 to stac-hash partitioned GeoParquet: library, AWS pipeline, benchmark"
requires-python = ">=3.12"
dependencies = ["atl06-processor", "atl06-benchmark", "atl06-cdk"]

[tool.uv.workspace]
members = ["processor", "benchmark", "cdk"]

[tool.uv.sources]
atl06-processor = { workspace = true }
atl06-benchmark = { workspace = true }
atl06-cdk = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "duckdb>=2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
